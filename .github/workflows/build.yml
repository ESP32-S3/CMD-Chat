name: Build CMD-Chat

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            goos: windows
            goarch: amd64
            binary: Windows-x64-CMD-Chat.exe
            archive: CMD-Chat-Windows-x64.zip
            launcher: CMD-Chat/Windows/Start CMD-Chat.bat
          - name: macOS Intel x64
            goos: darwin
            goarch: amd64
            binary: macOS-x64-CMD-Chat
            archive: CMD-Chat-macOS-Intel.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: macOS Apple Silicon ARM64
            goos: darwin
            goarch: arm64
            binary: macOS-arm64-CMD-Chat
            archive: CMD-Chat-macOS-Apple-Silicon.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: Linux x64
            goos: linux
            goarch: amd64
            binary: Linux-x64-CMD-Chat
            archive: CMD-Chat-Linux-x64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            binary: Linux-arm64-CMD-Chat
            archive: CMD-Chat-Linux-arm64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: ChromeOS x64
            goos: linux
            goarch: amd64
            binary: ChromeOS-x64-CMD-Chat
            archive: CMD-Chat-ChromeOS-x64.zip
            launcher: CMD-Chat/ChromeOS/Start-CMD-Chat.sh
            chromeos: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build terminal application
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # Stamp the version the update check compares against. A tag build is
          # the tag; anything else is marked as a development build, which the
          # check refuses to compare so nobody is told a branch build is stale.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "Building version ${VERSION}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          cp README.md dist/
          cp docs/QUICKSTART.md dist/QUICKSTART.md
          cp "${{ matrix.launcher }}" dist/
          if [ "${{ matrix.chromeos }}" = "true" ]; then
            cp clients/chromeos/cmd_chat.py dist/
          fi
          launcher_file=$(basename "${{ matrix.launcher }}")
          if [ "$GOOS" = "linux" ] || [ "$GOOS" = "darwin" ]; then
            chmod +x "dist/${{ matrix.binary }}" "dist/$launcher_file"
          fi
          cd dist
          zip -9 -r "../${{ matrix.archive }}" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Real end-to-end encryption

          CMD-Chat is a peer-to-peer terminal chat. Your messages go **straight from your
          computer to your friend's** — there is no company server in the middle holding
          your conversation.

          This release rebuilds the messaging cryptography. Until now, everything rested
          on a single TLS 1.3 connection. That protected you from someone watching the
          Wi-Fi, but it left one real gap: an attacker who could terminate TLS on both
          sides — which is exactly the position the relay and the phonebook sit in — could
          have forwarded the identity handshake between two connections of its own and sat
          in the middle of a conversation both people believed was private.

          **That gap is closed, and a second layer of encryption now sits above TLS.**

          ### CMDC1, the new end-to-end layer

          Every message is now encrypted a second time, inside the TLS session, with keys
          only your two computers ever hold. The relay, the phonebook, Cloudflare and your
          ISP see nothing but ciphertext.

          - **A modern authenticated handshake** — mutually authenticated ephemeral X25519,
            signed with the Ed25519 identity you already have. The same pattern used by
            IKEv2 and by TLS 1.3 itself.
          - **Tied to the exact connection it runs on.** This is what closes the gap above.
            An attacker in the middle holds two different TLS sessions, so the signatures
            it forwards don't verify, and the connection is refused instead of quietly
            succeeding.
          - **A Double Ratchet**, the published algorithm used by Signal, unmodified. Every
            single message gets its own key and its own nonce.
          - **Forward secrecy.** Your identity key signs; it never encrypts. If someone
            steals it a year from now, they still cannot read anything they recorded today.
          - **Recovery after a compromise.** Fresh key material is mixed in every time your
            friend replies, and an idle chat asks for it, so an attacker who briefly got
            into a device loses access again once they're out.
          - **Replays and tampering are rejected.** A message key is destroyed the moment
            it is used, so no captured message can ever be delivered twice. Reordered and
            lost messages still work; modified ones are refused without disturbing the
            conversation.

          ### Checking who you're actually talking to

          - **`/verify`** shows a **safety number** — a short code derived from both of
            your identity keys. Read it to each other on a call. If it matches, nobody is
            between you. CMD-Chat shows it automatically the first time you connect to
            someone and says plainly that it *is* the first time.
          - **A changed identity key stops the connection.** If an ID you've talked to
            before turns up with a different key, CMD-Chat refuses and explains why. There
            is no "accept anyway" button, because an attacker could arrange for you to see
            one. If your friend genuinely reinstalled, `cmd-chat forget <their-id>` is a
            deliberate step you take after checking with them some other way.
          - **The directory can no longer point you at the wrong person.** A phonebook
            answer for a different ID, or a LAN reply from a machine claiming someone
            else's ID, is now discarded. The ID CMD-Chat requires is always the one *you*
            typed.

          ### Your identity key is now protected on disk

          - **On Windows**, your private key is sealed by the operating system to your user
            account. Copying `identity.json` to another machine gets an attacker nothing.
          - **On any platform**, set `CMD_CHAT_IDENTITY_PASSPHRASE` to encrypt it with a
            passphrase (scrypt + XChaCha20-Poly1305). This is the strongest option.
          - **`cmd-chat security`** tells you which protection is actually in use, rather
            than leaving you to guess.
          - **Message text is never written to the debug log.** It used to be.

          ### Being straight with you about the limits

          There is a new **[SECURITY.md](https://github.com/ESP32-S3/CMD-Chat/blob/main/SECURITY.md)**
          with the full threat model, the exact key schedule, and a list of what is *not*
          protected. The short version:

          - **Encryption does not hide metadata.** The phonebook sees who is online and who
            looks up whom; the relay sees two IDs, two IP addresses, and message sizes and
            timing.
          - **Group rooms are not group end-to-end encryption.** A room is a set of
            two-person encrypted links around a human host, so **the host can read what it
            passes between guests**. Host rooms with people you'd trust to carry your
            messages.
          - **No post-quantum protection yet.**
          - **This code has not been independently audited.** It is not unbreakable and not
            "100% secure", and this release does not claim to be.

          ### Compatibility

          The protocol changed, so **both people need this version**. An older build cannot
          connect, and it fails with a clear message rather than falling back to something
          weaker. Your ID and your existing contacts carry over unchanged.

          ### Also in this release

          - `/verify`, `cmd-chat forget`, and `cmd-chat security`.
          - Message lengths are padded, so a short message and a long one look the same
            size on the wire.
          - Over a hundred new tests, including adversarial ones that run a real
            man-in-the-middle holding both TLS sessions and confirm it gets nothing.

          ## Also new: group chats, and a name of your own

          These landed alongside the encryption work and ship for the first time here.

          ### Group chats

          More than one person can join you now, and everyone in the room sees everyone
          else. There is nothing to create and no room code: whoever gets connected to is
          hosting, and **the room is that person's ID**.

          - **`/invite`** shows the ID that adds someone. This is the bit that's easy to
            get wrong — if you joined someone else, the ID to share is *theirs*, not
            yours, because your own would start a separate chat instead.
          - **`/who`** lists the room, and you'll see `* Jordan joined - 3 here` as people
            come and go.
          - **`/group off`** turns a room back into a one-to-one chat if you're hosting.
            Anyone already there stays; the next person to try is told why instead of
            being dropped in silence. The setting is remembered.

          **Read the note above about what a room is.** Every link in it is individually
          end-to-end encrypted, and nobody can impersonate anyone — every relayed message
          is labelled with the identity that connection actually proved, not with whatever
          the message claimed. But guests reach each other *through* the host, so the host
          can read what it passes on. Host rooms with people you'd trust to carry your
          messages.

          ### Pick a nickname

          **`/nick Alex`** and everyone sees *Alex* beside your messages instead of your
          computer's account name.

          Your nickname is stored **on your own computer only**. It is not in the
          phonebook, not in any database, and **nobody can look it up from your ID** — it
          reaches only the people you're actually chatting with, inside the encrypted
          connection. `/nick` on its own puts it back.

          ### Update notices on launch

          CMD-Chat asks GitHub whether a newer release exists and tells you once if one
          does. It **never installs anything**, **sends nothing about you** — one anonymous
          request asking what the newest version is — and **never delays launch**. Turn it
          off with `CMD_CHAT_NO_UPDATE_CHECK=1`.

          ### Carried over from v2.1.4

          - "Start a chat" no longer closes the terminal, and a blocked Windows firewall
            port is explained instead of silently breaking connectivity.
          - The window stays open when something goes wrong, on every platform.
          - Leaving a chat with `/quit` returns you to the prompt instead of closing
            CMD-Chat.
          NOTES
      - name: Publish GitHub release
        # The single place a release is created. A second workflow used to publish
        # here too and won the race, so every tag produced bare binaries instead of
        # these launcher zips, and this job always failed with "release already exists".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CMD-Chat ${GITHUB_REF_NAME}" \
            --notes-file notes.md
