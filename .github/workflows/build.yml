name: Build CMD-Chat

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            goos: windows
            goarch: amd64
            binary: Windows-x64-CMD-Chat.exe
            archive: CMD-Chat-Windows-x64.zip
            launcher: CMD-Chat/Windows/Start CMD-Chat.bat
          - name: macOS Intel x64
            goos: darwin
            goarch: amd64
            binary: macOS-x64-CMD-Chat
            archive: CMD-Chat-macOS-Intel.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: macOS Apple Silicon ARM64
            goos: darwin
            goarch: arm64
            binary: macOS-arm64-CMD-Chat
            archive: CMD-Chat-macOS-Apple-Silicon.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: Linux x64
            goos: linux
            goarch: amd64
            binary: Linux-x64-CMD-Chat
            archive: CMD-Chat-Linux-x64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            binary: Linux-arm64-CMD-Chat
            archive: CMD-Chat-Linux-arm64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: ChromeOS x64
            goos: linux
            goarch: amd64
            binary: ChromeOS-x64-CMD-Chat
            archive: CMD-Chat-ChromeOS-x64.zip
            launcher: CMD-Chat/ChromeOS/Start-CMD-Chat.sh
            chromeos: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build terminal application
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # Stamp the version the update check compares against. A tag build is
          # the tag; anything else is marked as a development build, which the
          # check refuses to compare so nobody is told a branch build is stale.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "Building version ${VERSION}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          cp README.md dist/
          cp docs/QUICKSTART.md dist/QUICKSTART.md
          cp "${{ matrix.launcher }}" dist/
          if [ "${{ matrix.chromeos }}" = "true" ]; then
            cp clients/chromeos/cmd_chat.py dist/
          fi
          launcher_file=$(basename "${{ matrix.launcher }}")
          if [ "$GOOS" = "linux" ] || [ "$GOOS" = "darwin" ]; then
            chmod +x "dist/${{ matrix.binary }}" "dist/$launcher_file"
          fi
          cd dist
          zip -9 -r "../${{ matrix.archive }}" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## CMD-Chat now tells you when there's a new version

          CMD-Chat is a peer-to-peer terminal chat. Your messages go **straight from your
          computer to your friend's** — there is no company server in the middle holding
          your conversation.

          ### New in this release

          - **Update notices on launch.** CMD-Chat asks GitHub whether a newer release
            exists and tells you once if one does:

            ```
            A newer CMD-Chat is available: v2.1.6 (you have v2.1.5).
            Download it from https://github.com/ESP32-S3/CMD-Chat/releases/tag/v2.1.6
            You can keep chatting on this version; updating is optional.
            ```

            It **never installs anything** — no self-update, no elevation, no writing over
            the running program. It prints a link and gets out of the way.

            It **sends nothing about you**: one anonymous request asking what the newest
            version is. No ID, no identity, no telemetry.

            It **never delays launch**. The check runs in the background and the notice
            appears when it arrives. If GitHub is unreachable, CMD-Chat says nothing.

            Turn it off with `CMD_CHAT_NO_UPDATE_CHECK=1`.

          - **`cmd-chat version`**, and the version now shows in the header.

          ### Carried over from v2.1.4

          - **"Start a chat" no longer closes the terminal.** Picking it from the menu
            crashed the program before it opened a single socket, and the launcher window
            disappeared with the reason still in it. Debug mode happened to avoid the
            crash, which is why the problem seemed to vanish there and leave only the
            Windows firewall prompt behind.
          - **The firewall prompt is explained instead of ignored.** If Windows blocks the
            chat port — or you click Cancel on "blocked some features of this app" —
            CMD-Chat now says so, tells you how to allow it, and keeps working over the
            encrypted relay rather than looking connectable when it isn't.
          - **The window stays open when something goes wrong.** Launchers now hold the
            terminal on an unexpected exit and show the reason, on every platform.
          - **The macOS and Linux launchers find the program again.** They looked for a
            file name the release ZIP does not contain.
          - Leaving a chat with `/quit` returns you to the prompt instead of closing
            CMD-Chat, and a chat that the other side closes no longer leaves you typing
            into a dead connection.

          - **No more "one person starts, the other joins."** Every open copy of CMD-Chat
            is already reachable. Both of you just open it, swap IDs, and **whoever pastes
            the other's ID first** connects — the other side does nothing and the chat
            simply opens in front of them.
          - **Nothing to agree on in advance**, and nothing to redo between conversations:
            after `/quit` you are still reachable.
          - `?`, `/id`, `/debug` and `/quit` at the prompt; the old menu numbers still
            answer and point you at the new flow.
          - `cmd-chat host` and `cmd-chat join` are unchanged for scripts.

          ### Still true from v2.0.x

          - **Chat with people outside your Wi-Fi**, with no router or port-forwarding
            setup.
          - **It picks the best connection automatically** — your local network first, then
            a direct internet connection, and only if neither works, an encrypted relay.
            You'll see which one it used.
          - **Works on strict networks**, including mobile hotspots and CGNAT.

          ### How it stays private

          Two small Cloudflare services make this possible, and neither can read your chat:

          - A **phonebook** (Cloudflare Worker + D1 database) that answers one question:
            *where can I reach this ID right now?* It stores your ID, your public key and a
            short-lived address that expires five minutes after you stop hosting. **It never
            stores or forwards a single chat message.**
          - A **relay**, used only when a direct connection is impossible. It forwards
            already-encrypted traffic between two peers and **holds none of the keys needed
            to read it**. It stores nothing.

          Your messages stay end-to-end encrypted (TLS 1.3) with Ed25519 identities on both
          ends, on every path — local, direct or relayed. Your private key never leaves
          your device.

          ### Getting started

          1. Download the file for your system below.
          2. Extract the zip.
          3. Double-click the launcher inside (`Start CMD-Chat.bat` on Windows).
          4. On Windows, click **Allow access** when the firewall asks.
          5. Send your friend the ID it shows. When they have CMD-Chat open too, paste
             their ID at the prompt — or let them paste yours.

          See `QUICKSTART.md` inside the download for more.

          ### Known limitations

          A direct connection can still fail on very restrictive networks; when it does,
          CMD-Chat falls back to the relay automatically.

          Windows still shows its firewall prompt the first time you open CMD-Chat.
          Suppressing it would need an administrator-level firewall rule, so CMD-Chat
          explains it instead and works either way.
          NOTES
      - name: Publish GitHub release
        # The single place a release is created. A second workflow used to publish
        # here too and won the race, so every tag produced bare binaries instead of
        # these launcher zips, and this job always failed with "release already exists".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CMD-Chat ${GITHUB_REF_NAME}" \
            --notes-file notes.md
