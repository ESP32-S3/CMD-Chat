name: Build CMD-Chat

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            goos: windows
            goarch: amd64
            binary: Windows-x64-CMD-Chat.exe
            archive: CMD-Chat-Windows-x64.zip
            launcher: CMD-Chat/Windows/Start CMD-Chat.bat
          - name: macOS Intel x64
            goos: darwin
            goarch: amd64
            binary: macOS-x64-CMD-Chat
            archive: CMD-Chat-macOS-Intel.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: macOS Apple Silicon ARM64
            goos: darwin
            goarch: arm64
            binary: macOS-arm64-CMD-Chat
            archive: CMD-Chat-macOS-Apple-Silicon.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: Linux x64
            goos: linux
            goarch: amd64
            binary: Linux-x64-CMD-Chat
            archive: CMD-Chat-Linux-x64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            binary: Linux-arm64-CMD-Chat
            archive: CMD-Chat-Linux-arm64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: ChromeOS x64
            goos: linux
            goarch: amd64
            binary: ChromeOS-x64-CMD-Chat
            archive: CMD-Chat-ChromeOS-x64.zip
            launcher: CMD-Chat/ChromeOS/Start-CMD-Chat.sh
            chromeos: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build terminal application
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # Stamp the version the update check compares against. A tag build is
          # the tag; anything else is marked as a development build, which the
          # check refuses to compare so nobody is told a branch build is stale.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "Building version ${VERSION}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          cp README.md dist/
          cp docs/QUICKSTART.md dist/QUICKSTART.md
          cp "${{ matrix.launcher }}" dist/
          if [ "${{ matrix.chromeos }}" = "true" ]; then
            cp clients/chromeos/cmd_chat.py dist/
          fi
          launcher_file=$(basename "${{ matrix.launcher }}")
          if [ "$GOOS" = "linux" ] || [ "$GOOS" = "darwin" ]; then
            chmod +x "dist/${{ matrix.binary }}" "dist/$launcher_file"
          fi
          cd dist
          zip -9 -r "../${{ matrix.archive }}" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## The phonebook can no longer tell who you are or where you are

          CMD-Chat is a peer-to-peer terminal chat. Your messages go **straight from your
          computer to your friend's** — there is no company server in the middle holding
          your conversation.

          v2.2.0 made the messages end-to-end encrypted. v2.3.0 made that protection
          quantum-safe. Neither touched the other half of the problem: **the directory that
          helps you find each other.**

          ### What was wrong

          To reach a friend who is not on your network, CMD-Chat looks them up in a small
          directory. That directory stored your CMD-Chat ID in one table and your IP
          addresses in another, linked together. One database query produced a live list of
          who everyone is and where they are — readable by anyone holding the database.

          It was worse than that. The service also recorded the public IP address it saw
          you connect from, so the list filled in **even for people who published no
          addresses at all**. And nothing ever used that record. It was pure liability.

          ### What it stores now

          Your entry is one row, and none of it means anything to the service:

          - a **handle** — a scrambled 128-bit fingerprint of your ID, which your computer
            works out, not the server. Your actual ID never reaches it.
          - a **write key** derived one-way from your private key, which proves an update
            is really from you while telling the service nothing about who you are.
          - a **sealed blob** holding your addresses, which the service cannot open.

          Your friend, who knows your ID because you gave it to them, works out the same
          handle, fetches the blob, and unlocks it on their own machine. The directory does
          its job and learns neither who you are nor where you are.

          A dump of the whole database is now a list of meaningless handles and unreadable
          blobs. There is a test that dumps every table and fails if a single ID or address
          appears anywhere in it.

          ### Being straight about the limits

          - **It stops bulk collection, not a targeted check.** Someone who *already has
            your ID* can work out your handle and read your entry, the same way your
            friends do. What is gone is the ability to scoop up everyone at once.
          - **Cloudflare still sees your IP address while serving the request** — it runs
            the connection, so it must. What changed is that **none of it is written
            down**.
          - **The relay still uses raw IDs.** If your connection has to fall back to the
            relay, Cloudflare still sees your ID alongside your address there. That is
            unfixed and honestly documented in
            [SECURITY.md](https://github.com/ESP32-S3/CMD-Chat/blob/main/SECURITY.md).

          ### One trade worth knowing about

            Because the directory no longer knows who you are, it can no longer prove an
            entry belongs to you. The first person to claim a handle keeps it. So somebody
            who already has your ID could claim yours first and stop you being findable, or
            point your friends at an address of their choosing.

            They **cannot read your messages and cannot pretend to be you** — connecting
            still requires proving your real identity key, end to end. And chats over your
            local network are unaffected.

          ### It is also cheaper and lighter

          Addresses used to be one database row each. They are now one sealed blob, so
          publishing writes a single row instead of several, and a lookup reads a single
          row instead of several. Listings also last fifteen minutes instead of five, which
          cuts the background traffic your computer sends to a third of what it was.

          ### Everything from v2.3.0 is still here

          - **Post-quantum encryption** — hybrid X25519 + ML-KEM-768, so traffic recorded
            today cannot be decrypted by a future quantum computer.
          - **End-to-end encryption above TLS**, which a hostile relay cannot get in the
            middle of.
          - **`/verify`** shows a safety number to read aloud to the other person. Still
            the most useful thing you can do, and still the one gap software cannot close
            by itself.
          - **A changed identity key stops the connection**, with no "accept anyway".
          - **Your private key is sealed on disk** — Windows DPAPI by default, or
            `CMD_CHAT_IDENTITY_PASSPHRASE` on any platform.
          - Group chats, `/invite`, `/who`, `/group off`, and `/nick`.

          ### Compatibility

          The directory service has already been updated and still answers older clients,
          so **nothing breaks if you wait**. You will simply keep using the old directory
          entries until you update.

          Chatting still requires both people to be on v2.3.0 or newer, because of the
          post-quantum change in that release.

          **This code has not been independently audited.**
          NOTES
      - name: Publish GitHub release
        # The single place a release is created. A second workflow used to publish
        # here too and won the race, so every tag produced bare binaries instead of
        # these launcher zips, and this job always failed with "release already exists".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CMD-Chat ${GITHUB_REF_NAME}" \
            --notes-file notes.md
