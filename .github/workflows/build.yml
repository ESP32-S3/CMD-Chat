name: Build CMD-Chat

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            goos: windows
            goarch: amd64
            binary: CMD-Chat.exe
            archive: CMD-Chat-Windows-x64.zip
          - name: macOS Intel
            goos: darwin
            goarch: amd64
            binary: CMD-Chat
            archive: CMD-Chat-macOS-Intel.zip
          - name: macOS Apple Silicon
            goos: darwin
            goarch: arm64
            binary: CMD-Chat
            archive: CMD-Chat-macOS-Apple-Silicon.zip
          - name: Linux x64
            goos: linux
            goarch: amd64
            binary: CMD-Chat
            archive: CMD-Chat-Linux-x64.zip
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            binary: CMD-Chat
            archive: CMD-Chat-Linux-arm64.zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          else
            go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          fi
          cp README.md QUICKSTART.md dist/
          if [ "$GOOS" = "windows" ]; then
            cp "launchers/windows/Start CMD-Chat.bat" dist/
          elif [ "$GOOS" = "darwin" ]; then
            cp "launchers/macos/Start CMD-Chat.command" dist/
          else
            cp "launchers/linux/Start-CMD-Chat.sh" dist/
            chmod +x "dist/Start-CMD-Chat.sh" "dist/${{ matrix.binary }}"
          fi
          cd dist
          zip -9 -r "../${{ matrix.archive }}" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes --title "CMD-Chat ${GITHUB_REF_NAME}"
