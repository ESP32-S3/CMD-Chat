name: Build CMD-Chat

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            goos: windows
            goarch: amd64
            binary: Windows-x64-CMD-Chat.exe
            archive: CMD-Chat-Windows-x64.zip
            launcher: CMD-Chat/Windows/Start CMD-Chat.bat
          - name: macOS Intel x64
            goos: darwin
            goarch: amd64
            binary: macOS-x64-CMD-Chat
            archive: CMD-Chat-macOS-Intel.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: macOS Apple Silicon ARM64
            goos: darwin
            goarch: arm64
            binary: macOS-arm64-CMD-Chat
            archive: CMD-Chat-macOS-Apple-Silicon.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: Linux x64
            goos: linux
            goarch: amd64
            binary: Linux-x64-CMD-Chat
            archive: CMD-Chat-Linux-x64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            binary: Linux-arm64-CMD-Chat
            archive: CMD-Chat-Linux-arm64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: ChromeOS x64
            goos: linux
            goarch: amd64
            binary: ChromeOS-x64-CMD-Chat
            archive: CMD-Chat-ChromeOS-x64.zip
            launcher: CMD-Chat/ChromeOS/Start-CMD-Chat.sh
            chromeos: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build terminal application
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # Stamp the version the update check compares against. A tag build is
          # the tag; anything else is marked as a development build, which the
          # check refuses to compare so nobody is told a branch build is stale.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "Building version ${VERSION}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          cp README.md dist/
          cp docs/QUICKSTART.md dist/QUICKSTART.md
          cp "${{ matrix.launcher }}" dist/
          if [ "${{ matrix.chromeos }}" = "true" ]; then
            cp clients/chromeos/cmd_chat.py dist/
          fi
          launcher_file=$(basename "${{ matrix.launcher }}")
          if [ "$GOOS" = "linux" ] || [ "$GOOS" = "darwin" ]; then
            chmod +x "dist/${{ matrix.binary }}" "dist/$launcher_file"
          fi
          cd dist
          zip -9 -r "../${{ matrix.archive }}" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Post-quantum encryption

          CMD-Chat is a peer-to-peer terminal chat. Your messages go **straight from your
          computer to your friend's** — there is no company server in the middle holding
          your conversation.

          v2.2.0 added real end-to-end encryption. This release closes the last big gap in
          it: **"record it now, decrypt it in twenty years."**

          ### The problem this solves

          The maths protecting your messages until now — X25519 — is safe against every
          computer that exists. It is *not* safe against a large quantum computer, and
          those may well exist eventually.

          That matters more than it sounds, because an attacker does not have to wait to
          act. They can record your encrypted traffic **today**, sit on it, and decrypt it
          whenever the hardware arrives. Anything you say now is only as private as the
          weakest computer that will ever exist.

          ### What changed

          The key exchange is now **hybrid X25519 + ML-KEM-768** — the same construction
          TLS 1.3 uses, and the same one Signal and Apple deployed for the same reason.
          ML-KEM is the NIST standard (FIPS 203) for post-quantum key exchange, and this
          uses the implementation from Go's own standard library.

          **Both** algorithms run, and their results are combined. That is the point:

          - if a quantum computer breaks X25519, ML-KEM still holds your session
          - if ML-KEM turns out to be broken by an ordinary computer — a real risk for
            maths this new — X25519 still holds it

          Neither is trusted on its own, so this is strictly stronger than what came
          before rather than a bet on the newer option.

          The exchange happens once, when you connect, and that is enough to protect the
          whole conversation. Everything afterwards is derived from it in a way that
          cannot be unwound without it.

          ### Being straight about what this does and doesn't cover

          **Covered:** somebody recording your conversation now and trying to read it
          later, however long they wait. That threat is closed.

          **Not covered:** the signatures proving *who you are* are still Ed25519, which a
          quantum computer could forge. But that only helps an attacker acting **live**, at
          the exact moment you connect — they cannot go back and impersonate someone in a
          conversation that already happened. Post-quantum signatures are much larger and
          much less settled than ML-KEM, so the honest trade is to take the confidentiality
          win now and revisit the rest when the standards mature.

          So: **this is quantum-safe against recording, not fully quantum-safe.** The full
          picture is in
          [SECURITY.md](https://github.com/ESP32-S3/CMD-Chat/blob/main/SECURITY.md).

          ### Everything from v2.2.0 is still here

          - **End-to-end encryption above TLS**, so the relay, the phonebook, Cloudflare
            and your ISP see nothing but scrambled bytes — including if they try to sit in
            the middle and impersonate your friend.
          - **A Double Ratchet**, so every message has its own key, old messages stay safe
            if your identity key is stolen later, and a conversation repairs itself after a
            device is compromised.
          - **`/verify`** shows a safety number to compare with the other person out loud.
            Still the single most useful thing you can do, and still the one gap software
            cannot close by itself.
          - **A changed identity key stops the connection**, with no "accept anyway".
          - **Your private key is sealed on disk** — Windows DPAPI by default, or
            `CMD_CHAT_IDENTITY_PASSPHRASE` on any platform.
          - **Group chats**, `/invite`, `/who`, `/group off`, and `/nick`.

          ### Compatibility

          **Both people need v2.3.0.** A v2.2.0 client is refused rather than quietly
          falling back to the non-quantum-safe exchange, because a silent fallback would
          hand a recording attacker exactly what this release is meant to deny them. You
          get a clear message telling you to update, not a confusing failure. Your ID and
          your existing contacts carry over unchanged.

          ### Also

          - `cmd-chat security` now reports the post-quantum status of your install.
          - Builds moved to Go 1.24, which is where `crypto/mlkem` lives.

          **This code has not been independently audited.**
          NOTES
      - name: Publish GitHub release
        # The single place a release is created. A second workflow used to publish
        # here too and won the race, so every tag produced bare binaries instead of
        # these launcher zips, and this job always failed with "release already exists".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CMD-Chat ${GITHUB_REF_NAME}" \
            --notes-file notes.md
