name: Build CMD-Chat

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            goos: windows
            goarch: amd64
            binary: Windows-x64-CMD-Chat.exe
            archive: CMD-Chat-Windows-x64.zip
            launcher: CMD-Chat/Windows/Start CMD-Chat.bat
          - name: macOS Intel x64
            goos: darwin
            goarch: amd64
            binary: macOS-x64-CMD-Chat
            archive: CMD-Chat-macOS-Intel.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: macOS Apple Silicon ARM64
            goos: darwin
            goarch: arm64
            binary: macOS-arm64-CMD-Chat
            archive: CMD-Chat-macOS-Apple-Silicon.zip
            launcher: CMD-Chat/macOS/Start CMD-Chat.command
          - name: Linux x64
            goos: linux
            goarch: amd64
            binary: Linux-x64-CMD-Chat
            archive: CMD-Chat-Linux-x64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            binary: Linux-arm64-CMD-Chat
            archive: CMD-Chat-Linux-arm64.zip
            launcher: CMD-Chat/Linux/Start-CMD-Chat.sh
          - name: ChromeOS x64
            goos: linux
            goarch: amd64
            binary: ChromeOS-x64-CMD-Chat
            archive: CMD-Chat-ChromeOS-x64.zip
            launcher: CMD-Chat/ChromeOS/Start-CMD-Chat.sh
            chromeos: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build terminal application
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary }}" ./cmd/cmd-chat
          cp README.md dist/
          cp docs/QUICKSTART.md dist/QUICKSTART.md
          cp "${{ matrix.launcher }}" dist/
          if [ "${{ matrix.chromeos }}" = "true" ]; then
            cp clients/chromeos/cmd_chat.py dist/
          fi
          launcher_file=$(basename "${{ matrix.launcher }}")
          if [ "$GOOS" = "linux" ] || [ "$GOOS" = "darwin" ]; then
            chmod +x "dist/${{ matrix.binary }}" "dist/$launcher_file"
          fi
          cd dist
          zip -9 -r "../${{ matrix.archive }}" .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes --title "CMD-Chat ${GITHUB_REF_NAME}"
