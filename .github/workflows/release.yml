name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build binaries
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/cmd-chat-windows-amd64.exe ./cmd/cmd-chat
          GOOS=linux GOARCH=amd64 go build -o dist/cmd-chat-linux-amd64 ./cmd/cmd-chat
          GOOS=linux GOARCH=arm64 go build -o dist/cmd-chat-linux-arm64 ./cmd/cmd-chat
          GOOS=darwin GOARCH=amd64 go build -o dist/cmd-chat-macos-amd64 ./cmd/cmd-chat
          GOOS=darwin GOARCH=arm64 go build -o dist/cmd-chat-macos-arm64 ./cmd/cmd-chat
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
