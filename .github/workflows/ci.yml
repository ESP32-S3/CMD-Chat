name: CI

on:
  push:
  pull_request:

# CI verifies the code. It never deploys: the Workers are released
# deliberately with `wrangler deploy`, and no Cloudflare credentials are
# available to this workflow.
permissions:
  contents: read

jobs:
  go:
    name: Go on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt
        # Only the packages that are kept gofmt-clean; the older files in
        # cmd/cmd-chat and internal/chat predate this check.
        shell: bash
        run: |
          unformatted="$(gofmt -l internal/phonebook internal/relay internal/connect)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/cmd-chat

  workers:
    name: ${{ matrix.worker }} Worker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [phonebook, relay]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Test
        # The phonebook suite runs against the real migrations on a local D1
        # instance; the relay suite runs a local Durable Object. Neither
        # touches production.
        run: npm test -- --run
